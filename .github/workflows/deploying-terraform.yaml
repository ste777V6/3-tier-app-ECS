name : Deploying on Terraform

on:
  workflow_dispatch:
  #push:
    #branches:
      #- main
env:
    AWS_REGION: us-east-1
    ECR_REPOSITORY: bootcamp2026-student-portal-ecr
    ECR_REGISTRY_URI: 344707019777.dkr.ecr.us-east-1.amazonaws.com
    IMAGE_TAG: ${{ github.sha }}
    Terraform_Version: 1.12.2
    infra_path: Infra
    frontend_path: frontend
    backend_path: backend 

jobs :

  #first job build and push the image to ECR
  build-and-push:
      name: Build and Push Initial Image
      runs-on: ubuntu-latest
    
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v2

        - name: Build the frontend Docker image
          working-directory: ${{ env.frontend_path }}
          run: |
            docker build -t ${{ env.ECR_REGISTRY_URI }}/${{ env.ECR_REPOSITORY }}-frontend:${{ env.IMAGE_TAG }} .
        
        - name : Build the backend Docker image
          working-directory: ${{ env.backend_path }}
          run: |
            docker build -t ${{ env.ECR_REGISTRY_URI }}/${{ env.ECR_REPOSITORY }}-backend:${{ env.IMAGE_TAG }} .
        
        - name: Set up AWS credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ env.AWS_REGION }}
        
        - name: Log in to Amazon ECR
          id: login-ecr
          uses: aws-actions/amazon-ecr-login@v1

        - name: Push the frontend Docker image to ECR
          run: docker push ${{ env.ECR_REGISTRY_URI }}/${{ env.ECR_REPOSITORY }}-frontend:${{ env.IMAGE_TAG }}
        
        - name: Push the backend Docker image to ECR
          run: docker push ${{ env.ECR_REGISTRY_URI }}/${{ env.ECR_REPOSITORY }}-backend:${{ env.IMAGE_TAG }}
    

